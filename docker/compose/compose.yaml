services:
  frontend:
    build:
      context: ../images/frontend
    ports:
      - 4200:4200
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ../images/backend
    ports:
      - 8080:8080
      - 9990:9990
    environment:
      - DB_URL=jdbc:postgresql://db:5432/app
      - DB_USER=app
      - DB_PASSWORD=app
      - SPRING_FLYWAY_ENABLED=true
    depends_on:
      - db

  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
